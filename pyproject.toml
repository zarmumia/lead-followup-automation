[project]
name = "lead-followup-automation"
version = "0.1.0"
description = "Daily follow-up rules for CRM leads: call lists, manager digest, client reminders."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fanny Rabinovitch" }]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true
